name: Publish New Release
on:
  release:
    types: [created]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '^1.22'

      - name: Set APP_VERSION
        id: set_version
        run: echo "APP_VERSION=$(sh setversion.sh)" >> $GITHUB_ENV

      - name: make dist
        run: mkdir -p dist

      - name: build
        run: go build -ldflags "-s -w -X main.version=${APP_VERSION}" -o dist/ ./...
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: additional items
        run: cp README.md dist/

      - name: Tar Folder
        if: ${{ matrix.goos != 'windows'}}
        run: tar czf ../release.tgz ./
        working-directory: dist


      - name: Lay out the tarball as <commit>/go-vncproxy.tar.gz with a .sha256 next to it
        run: |
          mkdir -p "upload/${GITHUB_SHA}"
          cp release.tgz "upload/${GITHUB_SHA}/go-vncproxy.tar.gz"
          (cd "upload/${GITHUB_SHA}" && sha256sum go-vncproxy.tar.gz > go-vncproxy.tar.gz.sha256)

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::878986216776:role/Github/GithubECRUploadRole_go-vncproxy
          role-session-name: GithubAction

      - name: Upload the release to codio-build-artifacts/master/
        run: aws s3 cp upload/ s3://codio-build-artifacts/master/go-vncproxy/ --recursive

      - name: Upload release assets
        run: gh release upload "$GITHUB_REF_NAME" "release.tgz#govnc-${{ matrix.goos }}-${{ matrix.goarch }}.tgz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
